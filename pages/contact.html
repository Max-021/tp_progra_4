<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - CineCritic</title>
    <!-- Ruta adaptada porque estamos dentro de /pages -->
    <link rel="stylesheet" href="../styles/styles.css">
</head>
<body>

    <header class="navbar">
        <div class="container">
            <h1><a href="../index.html" class="logo-link">CineCritic</a></h1>
            <button class="menu-toggle" aria-label="Abrir menú">&#9776;</button>
            <nav class="nav-links">
                <a href="../index.html">Inicio</a>
                <a href="./about.html">Nosotros</a>
                <div class="dropdown">
                    <a href="javascript:void(0)" class="dropbtn">Cartelera ▾</a>
                    <div class="dropdown-content">
                        <a href="./cartelera.html?filter=accion">Acción</a>
                        <a href="./cartelera.html?filter=drama">Drama</a>
                        <a href="./cartelera.html?filter=scifi">Ciencia Ficción</a>
                        <a href="./cartelera.html?filter=all">Todos</a>
                    </div>
                </div>
                <a href="./gallery.html">Galería</a>
                <a href="./contact.html">Contacto</a>
            </nav>
        </div>
    </header>

    <main class="container" style="max-width: 600px; margin-top: var(--spacing-lg);">
        <section class="movie-card" style="padding: var(--spacing-lg);">
            <h2>Dejanos tu opinión</h2>
            <p>¿Querés que reseñemos alguna película en particular? Escribinos.</p>
            
            <form id="contact-form">
                <div class="form-group">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" required>
                </div>

                <div class="form-group">
                    <label for="pelicula">Película a sugerir:</label>
                    <input type="text" id="pelicula" required>
                </div>
                
                <div class="form-group">
                    <label for="mensaje">Mensaje:</label>
                    <textarea id="mensaje" rows="4" required></textarea>
                </div>

                <button type="submit" class="btn">Enviar Sugerencia</button>
            </form>
            
            <!-- Mensaje de éxito oculto por defecto -->
            <p id="form-feedback" style="display: none; color: #4ade80; margin-top: var(--spacing-md); font-weight: bold;"></p>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2026 - CineCritic. TP Desarrollo Web por Maxi.</p>
        </div>
    </footer>

    <!-- Ruta adaptada -->
    <script src="../scripts/scripts.js"></script>
</body>
</html>
